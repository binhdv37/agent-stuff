schema_version: 1
kind: skill
id: bdv-explain-code
description: Explain existing (already-committed, no-diff) code for requests
  such as "explain this code," "walk me through this module/feature/API,"
  "review this for me," "/explain-code," or a question about a file, function,
  or snippet. Produces a short, high-level report covering structure,
  non-obvious behavior, edge cases, risk flags, open questions, and where to
  look next. Do not invoke automatically. Use this skill only when the user
  explicitly requests this workflow or names the skill.
activation: explicit
